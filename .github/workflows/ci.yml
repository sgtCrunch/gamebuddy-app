# On every push to main: test, build + push images to GHCR tagged with the
# commit SHA, then point the GitOps repo at the new tag so Argo CD deploys it.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io with GITHUB_TOKEN

env:
  IMAGE_PREFIX: ghcr.io/sgtCrunch/gamebuddy
  GITOPS_REPO: sgtCrunch/gamebuddy-gitops
  GITOPS_OVERLAY: overlays/local

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      # The unit tests that pass today (helpers, middleware). The DB-backed
      # model/route tests and the frontend test are leftovers from the
      # template project and fail against GameBuddy's schema; see README.
      - run: npm run test:ci

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: Backend
          - name: frontend
            context: Frontend
    steps:
      - uses: actions/checkout@v5
      # arm64 too, so the images run on Apple Silicon kind clusters
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The commit SHA, never "latest": each deploy is a new, traceable tag
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    # One tag bump at a time, in push order
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          # Fine-grained PAT with Contents: read/write on the GitOps repo only;
          # GITHUB_TOKEN cannot push to another repository
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Set image tags in the overlay
        env:
          SHA: ${{ github.sha }}
        run: |
          file="$GITOPS_OVERLAY/kustomization.yaml"
          for name in backend frontend; do
            # yq (preinstalled on GitHub runners) keeps the file's comments
            NAME="gamebuddy-$name" IMAGE="$IMAGE_PREFIX-$name" \
              yq -i '(.images[] | select(.name == strenv(NAME))) |= (.newName = strenv(IMAGE) | .newTag = strenv(SHA))' "$file"
          done
          git diff
      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_OVERLAY/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "Tags already at $SHA; nothing to commit"
            exit 0
          fi
          git commit -m "Deploy ${SOURCE}@${SHA::7}" -m "Image tag ${SHA} for gamebuddy-backend and gamebuddy-frontend." -m "CI run: ${RUN_URL}"
          # Retry if someone else pushed to the GitOps repo meanwhile
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
