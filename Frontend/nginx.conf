server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths (e.g. /user/:username after Steam
  # login) must return index.html so React Router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached aggressively
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
